name: Feature request
description: Suggest an idea for Arclight
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation at your agency, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: agency
    attributes:
      label: What kind of agency are you?
      options:
        - Web or software
        - Marketing or ads
        - SEO
        - Creative or branding
        - Other
  - type: markdown
    attributes:
      value: |
        Arclight deliberately never sends messages on its own and never scrapes Google Maps or social networks ([decisions](https://github.com/yordanchusein1/JARVIS/blob/HEAD/docs/DECISIONS.md)). Ideas that change these principles are welcome as discussions, but can't be accepted as features.
