name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arclight
          POSTGRES_PASSWORD: arclight
          POSTGRES_DB: arclight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arclight -d arclight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arclight:arclight@localhost:5432/arclight_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check that migrations match the schema
        run: pnpm db:generate && test -z "$(git status --porcelain packages/core/drizzle)"
      - name: Check that the SDK matches the API
        run: pnpm sdk:generate && test -z "$(git status --porcelain packages/sdk)"
      - run: pnpm test
      - run: pnpm --filter @arclight/dashboard build
      - run: pnpm --filter @arclight/web build
