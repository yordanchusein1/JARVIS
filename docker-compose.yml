# Local and single-server deployment. Ports are bound to 127.0.0.1; to expose JARVIS, put a reverse
# proxy with HTTPS in front of the dashboard (the session cookie is marked Secure).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jarvis -d jarvis']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/jarvis
      PORT: 8787
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8787:8787'

  worker:
    build:
      context: .
      target: api
    command: ['tsx', 'src/worker.ts']
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/jarvis
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AUDIT_CONCURRENCY: ${AUDIT_CONCURRENCY:-3}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-62}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      target: dashboard
    environment:
      JARVIS_API_URL: http://api:8787
      JARVIS_API_KEY: ${JARVIS_API_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
